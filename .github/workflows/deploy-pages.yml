name: Deploy English Learning Plan

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync public Duolingo progress
        env:
          DUOLINGO_USERNAME: Leo_zsh
        run: node scripts/fetch-duolingo.mjs
      - name: Validate learning plan
        run: |
          node scripts/validate.mjs
          node scripts/test-store.cjs
          node scripts/test-engine.cjs
          node scripts/test-audio.cjs
          node scripts/test-profile-menu.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html studio.css app.js engine.js store.js resources.js authentic-resources.js course-leo.js course-nico.js duolingo-data.json favicon.svg favicon.ico apple-touch-icon.png 404.html .nojekyll _site/
          cp -R assets _site/assets
          cp ASSET-LICENSES.md _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
